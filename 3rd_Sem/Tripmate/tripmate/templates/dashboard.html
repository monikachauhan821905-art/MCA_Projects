{% extends "base.html" %}
{% block title %}My Dashboard{% endblock %}
{% block page %}dashboard{% endblock %}
{% block content %}
<main class="container py-4">
  <header class="page-heading">
    <span class="page-eyebrow">Your travel space</span>
    <h1>Welcome back, <span id="dashName">{{ user['name'] }}</span></h1>
    <p>All your plans and bookings, together in one place.</p>
  </header>

  <div class="row g-3 mb-4" id="statCards"></div>

  <div class="row g-4">
    <div class="col-lg-7">
      <h2 class="h5 mb-3">Your bookings</h2>
      <div id="bookingList"></div>
    </div>
    <div class="col-lg-5">
      <div class="d-flex justify-content-between align-items-center">
        <h2 class="h5 mb-0">Your trip plans</h2>
        <a class="btn btn-sm btn-primary" href="{{ url_for('plan_page') }}"><i class="bi bi-plus-lg me-1"></i>New plan</a>
      </div>
      <div id="tripList" class="mt-3"></div>
    </div>
  </div>
</main>
{% endblock %}
