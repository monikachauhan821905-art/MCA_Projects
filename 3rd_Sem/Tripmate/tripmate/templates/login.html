{% extends "base.html" %}
{% block title %}Log in{% endblock %}
{% block page %}login{% endblock %}
{% block content %}
<main class="container auth-wrap">
  <div class="card auth-card shadow-sm mx-auto">
    <div class="card-body p-4">
      <div class="auth-mark"><i class="bi bi-compass"></i></div>
      <span class="page-eyebrow">Your next trip awaits</span>
      <h1 class="h4 mt-2 mb-2">Welcome back</h1>
      <p class="text-muted mb-4">Log in to pick up where your travel plans left off.</p>
      <div class="alert alert-danger d-none" id="authError"></div>
      <form id="loginForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" autocomplete="current-password" required>
        </div>
        <button class="btn btn-primary w-100" type="submit">Log in</button>
      </form>
      <p class="small text-muted mt-3 mb-0">New here? <a href="{{ url_for('register_page') }}">Create an account</a></p>
    </div>
  </div>
</main>
{% endblock %}
