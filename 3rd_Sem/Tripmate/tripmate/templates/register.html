{% extends "base.html" %}
{% block title %}Sign up{% endblock %}
{% block page %}register{% endblock %}
{% block content %}
<main class="container auth-wrap">
  <div class="card auth-card shadow-sm mx-auto">
    <div class="card-body p-4">
      <div class="auth-mark"><i class="bi bi-compass"></i></div>
      <span class="page-eyebrow">Start exploring</span>
      <h1 class="h4 mt-2 mb-2">Create your account</h1>
      <p class="text-muted mb-4">Save your favorite plans and keep every booking close.</p>
      <div class="alert alert-danger d-none" id="authError"></div>
      <form id="registerForm" novalidate>
        <div class="mb-3">
          <label class="form-label" for="name">Full name</label>
          <input type="text" class="form-control" id="name" autocomplete="name" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="email">Email</label>
          <input type="email" class="form-control" id="email" autocomplete="email" required>
        </div>
        <div class="mb-3">
          <label class="form-label" for="password">Password</label>
          <input type="password" class="form-control" id="password" autocomplete="new-password" minlength="6" required>
          <div class="form-text">At least 6 characters.</div>
        </div>
        <button class="btn btn-primary w-100" type="submit">Sign up</button>
      </form>
      <p class="small text-muted mt-3 mb-0">Already registered? <a href="{{ url_for('login_page') }}">Log in</a></p>
    </div>
  </div>
</main>
{% endblock %}
