<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}TripMate{% endblock %} · TripMate</title>
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.min.css" rel="stylesheet">
  <link href="{{ url_for('static', filename='css/style.css', v=3) }}" rel="stylesheet">
</head>
<body data-page="{% block page %}{% endblock %}" data-logged-in="{{ 'true' if user else 'false' }}">
<nav class="navbar navbar-expand-lg navbar-dark tm-nav sticky-top">
  <div class="container">
    <a class="navbar-brand fw-bold" href="{{ url_for('home') }}"><i class="bi bi-compass"></i> TripMate</a>
    <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#nav" aria-controls="nav" aria-expanded="false" aria-label="Toggle navigation">
      <span class="navbar-toggler-icon"></span>
    </button>
    <div class="collapse navbar-collapse" id="nav">
      <ul class="navbar-nav me-auto">
        <li class="nav-item"><a class="nav-link" href="{{ url_for('home') }}">Destinations</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('plan_page') }}">Plan a Trip</a></li>
        <li class="nav-item"><a class="nav-link" href="{{ url_for('dashboard_page') }}">My Dashboard</a></li>
      </ul>
      <ul class="navbar-nav align-items-lg-center gap-lg-2">
        {% if user %}
        <li class="nav-item"><span class="navbar-text me-2"><i class="bi bi-person-circle"></i> {{ user['name'] }}</span></li>
        <li class="nav-item"><button class="btn btn-outline-light btn-sm" id="logoutBtn">Log out</button></li>
        {% else %}
        <li class="nav-item"><a class="btn btn-outline-light btn-sm" href="{{ url_for('login_page') }}">Log in</a></li>
        <li class="nav-item"><a class="btn btn-warning btn-sm" href="{{ url_for('register_page') }}">Sign up</a></li>
        {% endif %}
      </ul>
    </div>
  </div>
</nav>

{% block content %}{% endblock %}

<footer class="text-center text-muted small py-4 mt-5 border-top">
  <span class="fw-semibold">TripMate</span> <span aria-hidden="true">·</span> Plan it. Book it. Go.
</footer>

<div class="toast-container position-fixed bottom-0 end-0 p-3">
  <div id="tmToast" class="toast align-items-center text-bg-dark border-0" role="alert">
    <div class="d-flex"><div class="toast-body" id="tmToastBody"></div>
      <button type="button" class="btn-close btn-close-white me-2 m-auto" data-bs-dismiss="toast"></button></div>
  </div>
</div>

<script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
<script src="{{ url_for('static', filename='js/app.js', v=3) }}"></script>
</body>
</html>
